<html lang="ru">

<title>До Нового года</title>

<style>
*{box-sizing:border-box}
:root{--glow:#4dabf7}

/* ===== ОСНОВА ===== */
body{
margin:0;height:100vh;
font-family:Montserrat,sans-serif;
background:linear-gradient(180deg,#06141a,#0b2b34);
color:#fff;overflow:hidden;
transition:background 3s linear;
}

/* ===== ФОН ===== */
body.bg-night{background:linear-gradient(180deg,#06141a,#0b2b34)}
body.bg-dawn{background:linear-gradient(180deg,#1b3a4b,#4dabf7)}
body.bg-day{background:linear-gradient(180deg,#6ec6ff,#b3e5fc)}
body.bg-evening{background:linear-gradient(180deg,#2c1a4d,#06141a)}

/* ===== ПОДСВЕТКА ===== */
.num,.tg-btn{
box-shadow:0 0 14px var(--glow);
border-color:var(--glow);
}
.no-glow .num,
.no-glow .tg-btn{box-shadow:none!important}

/* ===== РЕЖИМ ТИШИНЫ ===== */
.silent .snow{display:none}
.silent *{animation:none!important;transition:none!important}
.silent .num,.silent .tg-btn{box-shadow:none!important}

/* ===== РЕЖИМ ФОТО ===== */
body.photo-mode .call{display:none!important}

/* ===== СНЕГ ===== */
.snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.snow span{
position:absolute;top:-10px;
width:4px;height:4px;
background:#fff;border-radius:50%;
box-shadow:0 0 6px #fff;
animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(120vh)}}

/* ===== POPUP (оставили только для выбора языка — но теперь не используется) ===== */
.popup{
position:fixed;top:60px;left:50%;
transform:translateX(-50%);
background:#fff;color:#000;
border-radius:16px;padding:14px;
display:none;z-index:20;
width:300px;max-height:70vh;
overflow-y:auto;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

/* ===== ОКНА ВКЛАДОК ===== */
.panel{
position:fixed;top:60px;left:50%;
transform:translateX(-50%);
background:#fff;color:#000;
border-radius:16px;padding:14px;
display:none;z-index:9;
width:300px;max-height:70vh;
overflow-y:auto;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

/* ===== НАСТРОЙКИ ===== */
.setting{
display:flex;justify-content:space-between;
align-items:center;margin-top:12px;
font-weight:800;
}
.toggle{
width:42px;height:22px;
background:#ccc;border-radius:20px;
position:relative;cursor:pointer;
}
.toggle::after{
content:'';width:18px;height:18px;
background:#fff;border-radius:50%;
position:absolute;top:2px;left:2px;
transition:.25s;
}
.toggle.on{background:var(--glow)}
.toggle.on::after{left:22px}

/* ===== ЦВЕТА ===== */
.colors{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;margin-top:10px;
}
.color{
height:28px;border-radius:8px;
cursor:pointer;border:2px solid transparent;
}

/* ===== ТАЙМЕР ===== */
#viewTimer{display:block}
.center{
position:absolute;top:32%;left:50%;
transform:translate(-50%,-50%);
text-align:center;z-index:5;
}
.time{display:flex;gap:16px}
.num{
font-size:34px;font-weight:800;
padding:10px 14px;
border:2px solid var(--glow);
border-radius:14px;
}
.label{font-size:12px;opacity:.7}

/* ===== НАСТРОЕНИЕ ДНЯ ===== */
.mood{
margin-top:12px;
font-size:14px;
font-weight:700;
opacity:.85;
}

/* ===== СЧЁТЧИКИ ===== */
.counters{
margin-top:8px;
font-size:13px;
opacity:.75;
line-height:1.4;
}

/* ===== ЁЛКИ ===== */
.trees{
position:absolute;bottom:170px;
left:0;right:0;
display:flex;justify-content:center;
gap:70px;z-index:4;
}
.tree{
width:0;height:0;
border-left:40px solid transparent;
border-right:40px solid transparent;
border-bottom:110px solid #0f4d3a;
position:relative;
}
.tree:before{
content:'';position:absolute;
top:22px;left:-34px;
border-left:34px solid transparent;
border-right:34px solid transparent;
border-bottom:90px solid #0d4031;
}
.tree:after{
content:'';position:absolute;
top:48px;left:-28px;
border-left:28px solid transparent;
border-right:28px solid transparent;
border-bottom:70px solid #0b3529;
}
.ball{
position:absolute;width:8px;height:8px;
border-radius:50%;
box-shadow:0 0 8px rgba(255,255,255,.9);
}
.b1{top:30px;left:-10px;background:#ff6b6b}
.b2{top:48px;left:12px;background:#4dabf7}
.b3{top:70px;left:-20px;background:#51cf66}
.b4{top:96px;left:6px;background:#fcc419}

/* ===== ЗЕМЛЯ ===== */
.ground{
position:absolute;bottom:0;left:0;right:0;
height:180px;
background:linear-gradient(180deg,#f7fcff,#dbeaf3);
z-index:3;
}

/* ===== SUPPORT ===== */
.call{
text-align:center;
}
.call p{color:var(--glow);font-weight:800;margin-bottom:10px}
.tg-btn{
display:inline-flex;width:54px;height:54px;
border-radius:50%;background:var(--glow);
justify-content:center;align-items:center;
border:2px solid var(--glow);
}
.tg-btn svg{width:26px;height:26px;fill:#fff}

/* ===== OLD UPDATES scroll ===== */
.old{
margin-top:8px;padding-top:6px;
border-top:1px solid #ddd;
max-height:160px;overflow-y:auto;
}

/* ===== LIQUID TAB BAR (iOS 26 style) ===== */
:root{
  --bar: rgba(70,70,72,.86);
  --idle-pill: rgba(255,255,255,.12);

  /* активный цвет таббара = цвет подсветки */
  --active: var(--glow);
  --inactive: rgba(0,0,0,.85);

  --pad: 7px;
  --pillH: 60px;
}

.tabbar{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  width:360px;
  height:74px;
  border-radius:999px;
  background: var(--bar);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 18px 40px rgba(0,0,0,.65);
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  align-items:center;
  padding: var(--pad);
  overflow:visible;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  z-index:30;
}

.pill{
  position:absolute;
  left: var(--pad);
  top: 50%;
  transform: translateX(var(--x, 0px)) translateY(-50%) scale(1);

  width: calc((100% - (var(--pad) * 2)) / 3);
  height: var(--pillH);
  border-radius:999px;

  background: var(--idle-pill);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  transform-origin: center center;

  transition:
    transform .42s cubic-bezier(.16, 1, .3, 1),
    background-color .18s ease,
    box-shadow .18s ease,
    border-radius .35s cubic-bezier(.2,.9,.2,1);

  z-index:1;
  pointer-events: none;
}

.tabbar.is-water .pill{
  background: rgba(255,255,255,.004);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);

  transform:
    translateX(var(--x, 0px))
    translateY(-50%)
    scaleX(1.14)
    scaleY(1.18);

  box-shadow:
    0 10px 22px rgba(0,0,0,.22),
    0 0 0 1px rgba(255,255,255,.03);

  border-radius: 34px;
}

.tabbar.is-water .pill::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:inherit;
  padding:2px;

  background: conic-gradient(
    from 0deg,
    rgba(110,220,255,.08),
    rgba(0,140,255,.10),
    rgba(120,0,255,.06),
    rgba(255,180,0,.05),
    rgba(0,255,170,.05),
    rgba(110,220,255,.08)
  );

  filter: blur(2.2px);
  opacity: .28;

  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}

.tabbar.is-water .pill::after{
  content:"";
  position:absolute;
  inset:-12px;
  border-radius:inherit;
  background: radial-gradient(circle at 50% 50%,
    rgba(255,255,255,.10),
    rgba(255,255,255,0) 65%);
  filter: blur(12px);
  opacity: .16;
  pointer-events:none;
}

.tabbar.is-water .pill.squish{
  animation: squish .30s cubic-bezier(.16,1,.3,1);
}
@keyframes squish{
  0%   { transform: translateX(var(--x, 0px)) translateY(-50%) scaleX(1.14) scaleY(1.18); }
  45%  { transform: translateX(var(--x, 0px)) translateY(-50%) scaleX(1.20) scaleY(1.12); }
  100% { transform: translateX(var(--x, 0px)) translateY(-50%) scaleX(1.14) scaleY(1.18); }
}

.tab{
  position:relative;
  z-index:2;
  height: var(--pillH);
  border:0;
  background:transparent;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;

  color: var(--inactive);
  transition: color .18s ease;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro",system-ui;
}

.tab .icon{ font-size:22px; line-height:1; }
.tab .label{ font-size:12px; line-height:1; opacity:.95; }

.tab.active{ color: var(--active); }
.tabbar.is-water .tab.is-hovered{ color: var(--active); }

/* ===== LIQUID CIRCLE BUTTONS (Language / Share) ===== */
.top-area{
  position:fixed;
  top: env(safe-area-inset-top, 0px);
  right: env(safe-area-inset-right, 0px);
  padding:14px;
  display:flex;
  gap:10px;
  z-index:50;
}

.circle-menu{
  position:relative;
  width:52px;
  height:52px;
  border-radius:50%;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,.15);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:22px;
  cursor:pointer;

  transition:
    width .42s cubic-bezier(.16,1,.3,1),
    height .42s cubic-bezier(.16,1,.3,1),
    border-radius .42s cubic-bezier(.16,1,.3,1),
    background .2s ease;

  overflow:hidden;
}

.circle-menu.open{
  width:240px;
  height:160px;
  border-radius:28px;
  background: rgba(255,255,255,.06);
}

.circle-menu .icon{
  pointer-events:none;
  transition: opacity .2s ease;
}

.menu-content{
  position:absolute;
  inset:0;
  padding:16px;
  opacity:0;
  transform: translateY(6px);
  transition: opacity .25s ease, transform .25s ease;
  color:#fff;
  font-size:16px;
}

.circle-menu.open .menu-content{
  opacity:1;
  transform: translateY(0);
}

.circle-menu.open .icon{
  opacity:0;
}

.menu-title{
  font-size:16px;
  margin-bottom:14px;
}

.menu-btn{
  width:100%;
  padding:10px 12px;
  margin-bottom:8px;
  border-radius:14px;
  background: rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:#fff;
  font-size:15px;
  text-align:left;
  cursor:pointer;
}
.menu-btn:active{
  background: rgba(255,255,255,.14);
  transform: scale(.98);
}
</style>
</head>

         • Silent mode<br>
         • Background mood<br>
         • Glow selection<br>
         • Photo mode<br>
         • Mood of the day<br>
         • 🛠 Calendar is being reworked<br><br>
         <b>1.0.1</b><br>
         • Calendar<br>
         • Languages<br>
         • Share`
    },
    share:{
      shareText:'Until New Year!',
      copied:'Link copied!'
    },
    counters:(weekend,work)=>`📆 Until NY:<br>• 🏖 Weekends: ${weekend}<br>• 💼 Workdays: ${work}`,
    moods:[
      '🎄 Perfect day to celebrate',
      '❄️ Calm winter day',
      '✨ Time to make a wish',
      '🔔 New Year is very close',
      '☕ A chill day, no rush'
    ]
  }
};

function applyTranslations(){
  const t = i18n[currentLang];

  // title + units
  elTitle.textContent = t.title;
  elLd.textContent = t.units.d;
  elLh.textContent = t.units.h;
  elLm.textContent = t.units.m;
  elLs.textContent = t.units.s;

  // support
  elSupportText.textContent = t.support;

  // circle menus
  langBtn.querySelector('.menu-title').textContent = t.menu.lang;
  shareBtn.querySelector('.menu-title').textContent = t.menu.share;
  btnShare.textContent = t.menu.copy;

  // tab labels
  const tabLabels = document.querySelectorAll('.tabbar .tab .label');
  if(tabLabels[0]) tabLabels[0].textContent = t.tabs.timer;
  if(tabLabels[1]) tabLabels[1].textContent = t.tabs.settings;
  if(tabLabels[2]) tabLabels[2].textContent = t.tabs.info;

  // settings panel texts (без добавления id — просто по порядку)
  const settingsB = viewSettings.querySelector('b');
  if(settingsB) settingsB.textContent = t.settings.title;

  const settingSpans = viewSettings.querySelectorAll('.setting span');
  if(settingSpans[0]) settingSpans[0].textContent = t.settings.glow;
  if(settingSpans[1]) settingSpans[1].textContent = t.settings.silent;
  if(settingSpans[2]) settingSpans[2].textContent = t.settings.bg;
  if(settingSpans[3]) settingSpans[3].textContent = t.settings.photo;
  if(settingSpans[4]) settingSpans[4].textContent = t.settings.mood;

  const glowColorB = viewSettings.querySelector('b[style*="margin-top:14px"]');
  if(glowColorB) glowColorB.textContent = t.settings.glowColor;

  // info panel texts
  const infoB = viewInfo.querySelector('b');
  if(infoB) infoB.textContent = t.info.title;

  infoVersionLine.textContent = t.info.version;
  infoWhatsNewTitle.textContent = t.info.newTitle;
  infoWhatsNewDate.textContent = t.info.newDate;

  infoWhatsNewList.innerHTML = t.info.newList.map(x=>`<li>${x}</li>`).join('');

  btnOld.textContent = t.info.oldBtn;
  oldBox.innerHTML = t.info.oldHtml;

  // refresh mood/counters with new language
  updateMood();
  updateCounters();
}

/* ===== ЯЗЫК ===== */
function closeCircleMenus(){
  langBtn.classList.remove('open');
  shareBtn.classList.remove('open');
}
function setLang(l){
  currentLang = l;
  applyTranslations();
  closeCircleMenus();
}
setLang('ru');

/* ===== КРУГЛЫЕ МЕНЮ (ЯЗЫК / SHARE) ===== */
langBtn.addEventListener('click', (e) => {
  if (e.target.closest('.menu-btn')) return;
  langBtn.classList.toggle('open');
  shareBtn.classList.remove('open');
});
shareBtn.addEventListener('click', (e) => {
  if (e.target.closest('.menu-btn')) return;
  shareBtn.classList.toggle('open');
  langBtn.classList.remove('open');
});
btnRu.addEventListener('click', ()=>setLang('ru'));
btnEn.addEventListener('click', ()=>setLang('en'));

/* ===== SHARE ===== */
function share(){
  const t = i18n[currentLang];
  if (navigator.share){
    navigator.share({text: t.share.shareText, url: location.href}).catch(()=>{});
  } else {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(location.href).catch(()=>{});
    }
    alert(t.share.copied);
  }
  closeCircleMenus();
}
btnShare.addEventListener('click', share);

/* ===== НАСТРОЙКИ ===== */
glowToggle.onclick=()=>toggle('no-glow',glowToggle);
silentToggle.onclick=()=>toggle('silent',silentToggle);
photoToggle.onclick=()=>toggle('photo-mode',photoToggle);

function toggle(cls,t){
  document.body.classList.toggle(cls);
  t.classList.toggle('on',document.body.classList.contains(cls));
}

/* ===== ФОН ===== */
bgToggle.onclick=()=>{
  bgToggle.classList.toggle('on');
  updateBg();
}
function updateBg(){
  document.body.className=document.body.className.replace(/bg-\w+/g,'');
  if(!bgToggle.classList.contains('on'))return;
  const hh=new Date().getHours();
  document.body.classList.add(hh<6?'bg-night':hh<10?'bg-dawn':hh<18?'bg-day':'bg-evening');
}
setInterval(updateBg,60000);

/* ===== ЦВЕТА ===== */
const palette=['#ff6b6b','#ffa94d','#ffd43b','#51cf66','#94d82d','#4dabf7','#339af0','#845ef7','#ffffff'];
palette.forEach(c=>{
  const el=document.createElement('div');
  el.className='color';
  el.style.background=c;
  el.onclick=()=>document.documentElement.style.setProperty('--glow',c);
  colors.appendChild(el);
});

/* ===== НАСТРОЕНИЕ ===== */
function updateMood(){
  if(!moodToggle.classList.contains('on')){elMoodText.textContent='';return;}
  const arr = i18n[currentLang].moods;
  elMoodText.textContent = arr[new Date().getDate()%arr.length];
}
moodToggle.onclick=()=>{moodToggle.classList.toggle('on');updateMood();};
updateMood();

/* ===== СЧЁТЧИКИ ===== */
function updateCounters(){
  let work=0, weekend=0;
  const now=new Date();
  const end=new Date(now.getFullYear()+1,0,1);
  for(let dd=new Date(now); dd<end; dd.setDate(dd.getDate()+1)){
    (dd.getDay()==0||dd.getDay()==6)?weekend++:work++;
  }
  elCounters.innerHTML = i18n[currentLang].counters(weekend, work);
}
updateCounters();

/* ===== INFO: старые обновления ===== */
btnOld.addEventListener('click', ()=>{
  oldBox.style.display = (oldBox.style.display==='block') ? 'none' : 'block';
});

/* ===== ВКЛАДКИ ===== */
function showView(i){
  closeCircleMenus();

  viewTimer.style.display = (i===0) ? 'block' : 'none';
  viewSettings.style.display = (i===1) ? 'block' : 'none';
  viewInfo.style.display = (i===2) ? 'block' : 'none';

  timerTopBar.style.display = (i===0) ? 'flex' : 'none';
}

/* ===== LIQUID TAB BAR LOGIC ===== */
const bar  = document.getElementById('tabbar');
const pill = document.getElementById('pill');
const tabs = Array.from(bar.querySelectorAll('.tab'));

let holding=false;
let dragged=false;
let lastIndex=0;
let downX=0, downY=0;

const DRAG_THRESHOLD=8;
const TAP_DEFLATE_DELAY_MS=70;
let tapDeflateTimer=0;

function clearTapDeflate(){
  if(tapDeflateTimer){
    clearTimeout(tapDeflateTimer);
    tapDeflateTimer=0;
  }
}
function getPad(){
  const v=getComputedStyle(document.documentElement).getPropertyValue('--pad').trim();
  const n=parseFloat(v);
  return Number.isFinite(n)?n:7;
}
function waterOn(){ bar.classList.add('is-water'); }
function waterOff(){
  bar.classList.remove('is-water');
  tabs.forEach(t=>t.classList.remove('is-hovered'));
  pill.classList.remove('squish');
}
function setActiveIndex(i){
  tabs.forEach(t=>t.classList.remove('active'));
  tabs[i].classList.add('active');
  showView(i);
}
function setHoveredIndex(i){
  tabs.forEach(t=>t.classList.remove('is-hovered'));
  tabs[i].classList.add('is-hovered');
}
function indexFromClientX(clientX){
  const r=bar.getBoundingClientRect();
  const x=Math.min(Math.max(clientX-r.left,0),r.width);
  const colW=r.width/3;
  let i=Math.floor(x/colW);
  if(i<0)i=0;
  if(i>2)i=2;
  return i;
}
function setPillToIndex(i, doSquish=true){
  const barRect=bar.getBoundingClientRect();
  const tabRect=tabs[i].getBoundingClientRect();
  const pad=getPad();

  const x=tabRect.left-barRect.left-pad;
  pill.style.setProperty('--x',`${x}px`);

  if(doSquish && i!==lastIndex){
    pill.classList.remove('squish');
    void pill.offsetWidth;
    pill.classList.add('squish');
  }
  lastIndex=i;
}

bar.addEventListener('pointerdown',(e)=>{
  clearTapDeflate();
  holding=true;
  dragged=false;
  downX=e.clientX;
  downY=e.clientY;
  bar.setPointerCapture?.(e.pointerId);

  waterOn();
  const i=indexFromClientX(e.clientX);
  setHoveredIndex(i);
  setPillToIndex(i,true);
});

bar.addEventListener('pointermove',(e)=>{
  if(!holding) return;

  const dx=Math.abs(e.clientX-downX);
  const dy=Math.abs(e.clientY-downY);
  if(dx>DRAG_THRESHOLD || dy>DRAG_THRESHOLD) dragged=true;

  const i=indexFromClientX(e.clientX);
  setHoveredIndex(i);
  setPillToIndex(i,true);
});

bar.addEventListener('pointerup',(e)=>{
  if(!holding) return;
  holding=false;

  const i=indexFromClientX(e.clientX);

  if(dragged){
    setActiveIndex(i);
    setPillToIndex(i,false);
    waterOff();
    return;
  }

  setActiveIndex(i);
  tabs.forEach(t=>t.classList.remove('is-hovered'));

  waterOn();
  setPillToIndex(i,true);

  clearTapDeflate();
  tapDeflateTimer=setTimeout(()=>{
    if(!holding) waterOff();
  }, TAP_DEFLATE_DELAY_MS);
});

bar.addEventListener('pointercancel',()=>{
  holding=false;
  clearTapDeflate();
  waterOff();
});

/* старт */
const startIndex=tabs.findIndex(t=>t.classList.contains('active'));
setPillToIndex(startIndex>=0?startIndex:0,false);
showView(0);
</script>
