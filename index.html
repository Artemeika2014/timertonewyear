<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>До Нового года</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
font-family:Montserrat,sans-serif;
background:linear-gradient(180deg,#06141a,#0b2b34);
color:#fff;
overflow:hidden;
}

/* СНЕГ */
.snow{position:fixed;inset:0;pointer-events:none;z-index:1}
.snow span{
position:absolute;top:-10px;
width:4px;height:4px;
background:#fff;border-radius:50%;
box-shadow:0 0 6px #fff;
animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(120vh)}}

/* КНОПКИ */
.top-bar{
position:fixed;
top:12px;left:0;right:0;
display:flex;
justify-content:center;
gap:10px;
z-index:10;
}
.top-bar button{
padding:10px 16px;
border:none;
border-radius:20px;
background:#4dabf7;
font-weight:800;
color:#fff;
cursor:pointer;
box-shadow:0 0 12px rgba(77,171,247,.7);
}

/* POPUP */
.popup{
position:fixed;
top:60px;
left:50%;
transform:translateX(-50%);
background:#fff;
color:#000;
border-radius:16px;
padding:14px;
display:none;
z-index:20;
width:280px;
box-shadow:0 12px 30px rgba(0,0,0,.35);
}

/* КАЛЕНДАРЬ */
.cal-grid{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
text-align:center;
font-size:13px;
}
.cal-day{padding:6px;border-radius:8px}
.today{background:#4dabf7;color:#fff;font-weight:800}

/* ТАЙМЕР */
.center{
position:absolute;
top:32%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:5;
}
.time{display:flex;gap:16px}
.num{
font-size:34px;
font-weight:800;
padding:10px 14px;
border:2px solid #4dabf7;
border-radius:14px;
box-shadow:0 0 14px rgba(77,171,247,.8);
}
.label{font-size:12px;opacity:.7}

/* ЁЛКИ */
.trees{
position:absolute;
bottom:170px;
left:0;right:0;
display:flex;
justify-content:center;
gap:70px;
z-index:4;
}
.tree{
width:0;height:0;
border-left:40px solid transparent;
border-right:40px solid transparent;
border-bottom:110px solid #0f4d3a;
position:relative;
}
.tree:before{
content:'';
position:absolute;top:22px;left:-34px;
border-left:34px solid transparent;
border-right:34px solid transparent;
border-bottom:90px solid #0d4031;
}
.tree:after{
content:'';
position:absolute;top:48px;left:-28px;
border-left:28px solid transparent;
border-right:28px solid transparent;
border-bottom:70px solid #0b3529;
}
.ball{
position:absolute;
width:8px;height:8px;
border-radius:50%;
box-shadow:0 0 8px rgba(255,255,255,.9);
}
.b1{top:30px;left:-10px;background:#ff6b6b}
.b2{top:48px;left:12px;background:#4dabf7}
.b3{top:70px;left:-20px;background:#51cf66}
.b4{top:96px;left:6px;background:#fcc419}

/* ЗЕМЛЯ */
.ground{
position:absolute;
bottom:0;left:0;right:0;
height:180px;
background:linear-gradient(180deg,#f7fcff,#dbeaf3);
z-index:3;
}

/* SUPPORT */
.call{
position:absolute;
bottom:26px;
left:0;right:0;
text-align:center;
z-index:5;
}
.call p{color:#4dabf7;font-weight:800;margin-bottom:10px}
.tg-btn{
display:inline-flex;
width:54px;height:54px;
border-radius:50%;
background:#4dabf7;
justify-content:center;
align-items:center;
border:2px solid #4dabf7;
box-shadow:0 0 16px rgba(77,171,247,.8);
}
.tg-btn svg{width:26px;height:26px;fill:#fff}

/* ВЕРСИЯ + ЧТО НОВОГО */
.version{
position:absolute;
bottom:4px;
width:100%;
text-align:center;
font-size:11px;
color:#9aa3ab;
opacity:.7;
z-index:6;
}
.news-btn{
position:fixed;
bottom:22px;
right:14px;
font-size:12px;
font-weight:800;
color:#4dabf7;
cursor:pointer;
z-index:10;
}
.old{
max-height:120px;
overflow-y:auto;
border-top:1px solid #ddd;
margin-top:8px;
padding-top:6px;
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<div class="top-bar">
<button onclick="toggleCalendar()">📅</button>
<button onclick="toggleLang()">🌐</button>
<button onclick="share()">🔗</button>
</div>

<div class="popup" id="calendar"></div>

<div class="popup" id="langMenu">
<div onclick="setLang('ru')">🇷🇺 Российский</div>
<div onclick="setLang('en')">🇺🇸 Американский</div>
<div onclick="setLang('cn')">🇨🇳 Китайский</div>
</div>

<div class="popup" id="news">
<b>Что нового — 1.0.1</b>
<ul>
<li>Добавлена подсветка таймера</li>
<li>Подсветка кнопок</li>
<li>Подсвеченный снег</li>
</ul>
<button onclick="toggleOld()">Старые обновления</button>
<div class="old" id="old" style="display:none">
<b>1.0.0</b><br>
• Таймер<br>
• Календарь<br>
• Языки<br>
• Ёлки и земля
</div>
</div>

<div class="center">
<h1 id="title"></h1>
<div class="time">
<div><div class="num" id="d"></div><div class="label" id="ld"></div></div>
<div><div class="num" id="h"></div><div class="label" id="lh"></div></div>
<div><div class="num" id="m"></div><div class="label" id="lm"></div></div>
<div><div class="num" id="s"></div><div class="label" id="ls"></div></div>
</div>
</div>

<div class="trees">
<div class="tree"><div class="ball b1"></div><div class="ball b2"></div><div class="ball b3"></div><div class="ball b4"></div></div>
<div class="tree"><div class="ball b1"></div><div class="ball b2"></div><div class="ball b3"></div><div class="ball b4"></div></div>
</div>

<div class="ground"></div>

<div class="call">
<p id="supportText"></p>
<a class="tg-btn" href="https://t.me/misterlomtik1" target="_blank">
<svg viewBox="0 0 24 24"><path d="M9.9 16.2l-.4 5.3 3.7-3.6 5.3 3.9c1 .6 1.7.3 2-.9l3.6-16.9c.4-1.6-.6-2.3-1.6-1.9L1.4 9.6c-1.5.6-1.5 1.4-.3 1.8l5.4 1.7L19.5 5c.7-.4 1.3-.2.8.3"/></svg>
</a>
</div>

<div class="version" id="versionText"></div>
<div class="news-btn" onclick="toggleNews()">📢 Что нового</div>

<script>
/* СНЕГ */
const snow=document.getElementById('snow');
for(let i=0;i<100;i++){
const s=document.createElement('span');
s.style.left=Math.random()*100+'%';
s.style.animationDuration=5+Math.random()*8+'s';
snow.appendChild(s);
}

/* ТАЙМЕР */
function tick(){
const now=new Date();
const year=now.getFullYear()+1;
const diff=new Date(year,0,1)-now;
d.textContent=Math.floor(diff/86400000);
h.textContent=Math.floor(diff/3600000)%24;
m.textContent=Math.floor(diff/60000)%60;
s.textContent=Math.floor(diff/1000)%60;
}
setInterval(tick,1000);tick();

/* КАЛЕНДАРЬ */
let calDate=new Date();
function toggleCalendar(){calendar.style.display=calendar.style.display==='block'?'none':'block';renderCalendar()}
function renderCalendar(){
const y=calDate.getFullYear(),m=calDate.getMonth();
const first=(new Date(y,m,1).getDay()||7)-1;
const days=new Date(y,m+1,0).getDate();
let html=`<div style="display:flex;justify-content:space-between;font-weight:800">
<button onclick="calDate.setMonth(calDate.getMonth()-1);renderCalendar()">‹</button>
${calDate.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}
<button onclick="calDate.setMonth(calDate.getMonth()+1);renderCalendar()">›</button>
</div><div class="cal-grid">`;
['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>html+=`<div style="opacity:.5">${d}</div>`);
for(let i=0;i<first;i++)html+='<div></div>';
for(let d=1;d<=days;d++){
const t=new Date();
html+=`<div class="cal-day ${d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear()?'today':''}">${d}</div>`;
}
calendar.innerHTML=html+'</div>';
}

/* ЯЗЫК */
const texts={
ru:{title:'До Нового года',d:'дней',h:'часов',m:'мин',s:'сек',support:'Хотите свой регион или крутой декор? Пишите!',version:'Версия: 1.0.1'},
en:{title:'Until New Year',d:'days',h:'hours',m:'min',s:'sec',support:'Want your region or decor? Message me!',version:'Version: 1.0.1'},
cn:{title:'新年前倒计时',d:'天',h:'小时',m:'分钟',s:'秒',support:'想要你的地区或装饰？联系我！',version:'版本：1.0.1'}
};
function toggleLang(){langMenu.style.display=langMenu.style.display==='block'?'none':'block'}
function setLang(l){
title.textContent=texts[l].title;
ld.textContent=texts[l].d;
lh.textContent=texts[l].h;
lm.textContent=texts[l].m;
ls.textContent=texts[l].s;
supportText.textContent=texts[l].support;
versionText.textContent=texts[l].version;
langMenu.style.display='none';
}
setLang('ru');

/* ЧТО НОВОГО */
function toggleNews(){news.style.display=news.style.display==='block'?'none':'block'}
function toggleOld(){old.style.display=old.style.display==='block'?'none':'block'}

/* SHARE */
function share(){
const v=['омг какой крутой календарь','реально топ таймер','нашёл офигенный сайт'];
const msg=`${v[Math.floor(Math.random()*v.length)]} 👉 timertonewyear.site`;
navigator.share?navigator.share({text:msg,url:'https://timertonewyear.site'}):(navigator.clipboard.writeText(msg),alert('Скопировано'));
}
</script>

</body>
</html>
